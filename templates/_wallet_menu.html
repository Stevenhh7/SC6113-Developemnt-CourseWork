<div class="wallet-control">
  <button id="connect-button" class="button small" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="wallet-menu" disabled>Connect wallet</button>
  <div id="wallet-menu" class="wallet-menu" role="menu" aria-label="Wallet accounts" hidden>
    <p class="wallet-menu-heading">Connected accounts</p>
    <div id="wallet-accounts" role="group" aria-label="Choose an account"></div>
    <p class="wallet-menu-help">Only accounts connected through MetaMask appear here.</p>
    <button id="authorize-accounts" class="wallet-menu-action" type="button" role="menuitem">Manage accounts in MetaMask <span aria-hidden="true">↗</span></button>
    <button id="reconnect-wallet" class="wallet-menu-action" type="button" role="menuitem">Reconnect wallet</button>
  </div>
</div>

name: MicroInvest checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: microinvest_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: microinvest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microinvest_test -d microinvest_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://microinvest_test:local-ci-only@127.0.0.1:5432/microinvest_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Compile and test contract and amount logic
        run: |
          pnpm run compile
          pnpm test
      - name: Test Flask
        run: .venv/bin/python -m pytest -p no:cacheprovider
      - name: Test browser integration on a local chain
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:browser

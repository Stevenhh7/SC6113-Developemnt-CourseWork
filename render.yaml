services:
  - type: web
    name: microinvest
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init-catalog.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CHAIN_ID
        value: "11155111"
      - key: LOCAL_DEVELOPMENT
        value: "false"
      - key: RPC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: DEPLOYMENT_BLOCK
        sync: false
      - key: RPC_TIMEOUT
        value: "10"
      - key: LOG_CHUNK_SIZE
        value: "1000"
      - key: HISTORY_PAGE_BLOCKS
        value: "5000"
